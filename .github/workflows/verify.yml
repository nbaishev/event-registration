name: Verify
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --global corepack@0.34.0
      - run: make bootstrap
      - run: make verify-ci
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --global corepack@0.34.0
      - run: make bootstrap
      - run: cd frontend && corepack pnpm exec playwright install --with-deps chromium
      - run: make e2e
