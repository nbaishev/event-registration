[project]
name = "event-registration-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "argon2-cffi>=25,<26",
  "email-validator>=2,<3",
  "pyjwt>=2.10,<3",
  "python-dotenv>=1,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.9,<1", "mypy>=1.15,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
