# Temporary HTTP deployment. Use this file alone, without compose.yaml.
name: event-registration-prod

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  postgres:
    <<: *runtime
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-event_registration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-event_registration}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    <<: *runtime
    image: redis:7.4.7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    <<: *runtime
    build: ./backend
    image: event-registration-prod-backend:${APP_IMAGE_TAG:-latest}
    environment: &backend-environment
      # Deliberate temporary HTTP mode: production enforces HTTPS/Secure cookies.
      ENVIRONMENT: development
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact HTTP origin in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env.prod}
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-event_registration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-event_registration}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:?Set the external SMTP relay in .env.prod}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env.prod}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env.prod}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env.prod}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 24
      start_period: 30s

  worker:
    <<: *runtime
    image: event-registration-prod-backend:${APP_IMAGE_TAG:-latest}
    build: ./backend
    environment: *backend-environment
    command: [celery, -A, app.notifications.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *runtime
    image: event-registration-prod-backend:${APP_IMAGE_TAG:-latest}
    build: ./backend
    environment: *backend-environment
    command: [celery, -A, app.notifications.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    <<: *runtime
    build: ./frontend
    image: event-registration-prod-frontend:${APP_IMAGE_TAG:-latest}

  nginx:
    <<: *runtime
    image: nginx:1.28-alpine
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/api/ready]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
